spring:
  application:
    name: scms-be
  # KHÔNG đặt spring.profiles.default: profile phải set tường minh qua SPRING_PROFILES_ACTIVE
  # (dev khi chạy local, prod khi deploy) để tránh vô tình chạy dev mode trên prod.
  datasource:
    # MySQL 8+: giữ đọc được từ ENV để chuyển môi trường thật không cần sửa file.
    # TLS BẬT mặc định (PREFERRED: dùng TLS nếu server hỗ trợ, cho phép chạy localhost không TLS).
    # Prod phải ENFORCE bằng DB_SSL_MODE=VERIFY_IDENTITY (verify luôn CA + hostname) — xem application-prod.yml.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scms}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Dev: Hibernate tự tạo bảng. Prod: set DDL_AUTO=validate (schema do migration quản lý).
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc.time_zone: UTC
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

app:
  probe-x: 1
  jwt:
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    # Không rememberMe -> refresh token chỉ sống bằng "phiên" (mặc định 12 giờ). RememberMe -> refresh-ttl-days.
    session-refresh-ttl-hours: ${JWT_SESSION_REFRESH_TTL_HOURS:12}
    # File base KHÔNG có secret default: thiếu ENV -> @NotBlank fail-fast lúc khởi động (không bao giờ chạy lặng lẽ
    # với secret đã public trên git). Giá trị chạy-được-ngay chỉ có ở application-dev.yml.
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    # Bắt buộc: jjwt từ chối parse token khi issuer rỗng/null (mọi request 401).
    issuer: ${JWT_ISSUER:scms}
  security:
    login:
      login-max-failures: ${LOGIN_MAX_FAILURES:5}
      login-failure-window-min: ${LOGIN_FAILURE_WINDOW_MIN:15}
      login-lock-min: ${LOGIN_LOCK_MIN:15}
    # Rate-limit theo IP cho /auth/login (bù khoá theo username): 10 lần / 5 phút -> chặn 5 phút.
    login-ip:
      max-per-window: ${LOGIN_IP_MAX_PER_WINDOW:10}
      window-min: ${LOGIN_IP_WINDOW_MIN:5}
      block-min: ${LOGIN_IP_BLOCK_MIN:5}
    refresh:
      # Chặn refresh loop: 20 lần / 5 phút -> tạm chặn 5 phút (trả ACCOUNT_LOCKED + Retry-After).
      max-per-window: ${REFRESH_MAX_PER_WINDOW:20}
      window-min: ${REFRESH_WINDOW_MIN:5}
      block-min: ${REFRESH_BLOCK_MIN:5}
      # true CHỈ khi app nằm sau reverse proxy (nginx/ALB/k8s ingress) đã ghi đè X-Forwarded-For.
      # Bật khi app lộ trực tiếp ra internet = client tự bịa IP để lách rate-limit.
      trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    cookie:
      refresh-enabled: ${AUTH_REFRESH_COOKIE:false}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:scms_rt}
      refresh-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
      same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Lax}
      # Cookie refresh có Secure hay không. Prod đặt true (luôn HTTPS); dev có thể false.
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    # Chỉ dùng ở dev: tạo 4 role + tài khoản COO mặc định nếu DB trống. Prod: false.
    # Mật khẩu seed không có default ở base — profile dev tự đặt mặc định; để trống thì bỏ qua tạo user COO.
    seed:
      enabled: ${SEED_DATA:false}
      coo-username: coo
      coo-password: ${SEED_COO_PASSWORD:}
  kiosk:
    # Pepper cho pin_lookup_hash (SHA-256(branchId:pin:pepper)) — bắt buộc ở MỌI profile, ≥ 16 ký tự.
    # Không có default: thiếu ENV thì app fail-fast (xem PinConfig). Đổi pepper = mọi PIN cũ phải đặt lại.
    pin-pepper: ${KIOSK_PIN_PEPPER:}
  openapi:
    # Mong muốn bật Swagger. Route Swagger chỉ thật sự public khi CẢ HAI: cờ này = true
    # VÀ profile đang chạy là dev/test. Ở prod, cờ true cũng không mở (401) — xem SecurityConfig.
    enabled: ${OPENAPI_ENABLED:false}
  upload-dir: ${UPLOAD_DIR:./uploads}
  kiosk-api-key: ${KIOSK_API_KEY:}
  sepay:
    mode: ${SEPAY_MODE:sandbox}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

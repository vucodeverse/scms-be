# Profile test: H2 in-memory (MySQL mode) để test HTTP không cần container.
spring:
  datasource:
    url: jdbc:h2:mem:scms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    # Base không còn secret default -> test cấp riêng; hai secret PHẢI khác nhau (JwtTokenProvider chặn nếu trùng).
    access-secret: test-access-secret-0123456789-abcdefghij
    refresh-secret: test-refresh-secret-0123456789-zyxwvutsrq
  security:
    # Nâng ngưỡng rate-limit IP để luồng login/IT không bị chặn chéo nhau.
    login-ip:
      max-per-window: 100000
      window-min: 5
      block-min: 5
  auth:
    seed:
      enabled: true
      coo-username: coo
      coo-password: Admin@123
  kiosk:
    pin-pepper: test-only-pin-pepper-0123456789abcdef
  openapi:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    edu.fpt.sba.scms: INFO

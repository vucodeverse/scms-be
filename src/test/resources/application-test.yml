# Profile test: H2 in-memory (MySQL mode) để test HTTP không cần container.
spring:
  datasource:
    url: jdbc:h2:mem:scms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

app:
  auth:
    seed:
      enabled: true
      coo-username: coo
      coo-password: Admin@123

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    edu.fpt.sba.scms: INFO
